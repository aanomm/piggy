name: Feature request
description: Suggest a Piggy improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Piggy solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Piggy do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety/privacy considerations
      description: What paths, files, personal data, or destructive behavior could be involved?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
