name: CI

on:
  pull_request:
  push:
    branches: [main, live]

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release
